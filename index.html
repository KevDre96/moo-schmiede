.picker-title strong,.picker-selected-head strong{font:700 19px Georgia,'Times New Roman',serif;color:#e7d5b1}

async function startMooCloud() {
  if (!url || !key || !window.supabase?.createClient) {
    loginView('Cloud-Konfiguration konnte nicht geladen werden. Bitte Seite neu laden.', 'error');
    throw new Error('Supabase-Konfiguration fehlt');
  }
  const db=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},global:{headers:{'x-application-name':'moo-schmiede'}}});
  let me;
  try { const {data,error}=await db.auth.getUser(); if (!error) me=data.user; } catch(_e) { /* Dialog erlaubt neuen Login */ }
  if(!me){
    loginView();
    me=await new Promise(resolve=>{
      document.getElementById('moo-login-form').addEventListener('submit',async e=>{
        e.preventDefault();
        const btn=document.getElementById('moo-login-submit');
        const out=document.getElementById('moo-login-message');
        btn.disabled=true;btn.textContent='Anmeldung wird geprüft …';out.textContent='';
        try{
          const {data,error}=await db.auth.signInWithPassword({email:document.getElementById('moo-email').value.trim(),password:document.getElementById('moo-password').value});
          if(error)throw error;
          document.getElementById('moo-password').value='';resolve(data.user);
        }catch(err){out.textContent='Anmeldung fehlgeschlagen: '+(err.message||String(err));out.classList.add('error');}
        finally{btn.disabled=false;btn.textContent='Anmelden';}
      });
    });
  }
  const roleResult=await db.from('moo_access').select('role,display_name').eq('user_id',me.id).maybeSingle();
  if(roleResult.error || !roleResult.data){
    await db.auth.signOut();
    loginView('Für dieses Benutzerkonto wurde noch kein Moo-Schmiede-Zugang freigeschaltet.','error');
    throw new Error('Keine Moo-Schmiede-Berechtigung');
  }
  const docResult=await db.from('moo_documents').select('payload,revision').eq('id',1).single();
  if(docResult.error || !docResult.data){
    loginView('Datenbank konnte nicht gelesen werden: '+(docResult.error?.message||'kein Datensatz'),'error');
    throw new Error('Online-Datenbank nicht erreichbar');
  }
  let revision=Number(docResult.data.revision),dirty=false,busy=false,saveTimer=null,changed=0,lastPayload=null,blocked=false;
  let onRemote=()=>{};
  function status(text,type=''){
    const elem=document.querySelector('.save-indicator');if(elem)elem.textContent='☁ '+text;
    const note=document.getElementById('shopping-note-status');if(note){note.textContent=text;note.classList.toggle('error',type==='error');}
    const error=document.getElementById('moo-cloud-error');
    if(error){error.hidden=type!=='error';error.textContent=type==='error'?text:'';}
  }
  async function flush(){
    if(busy||!dirty||blocked)return;
    busy=true;const n=changed;
    const snap=lastPayload;
    status('Speichert online …');
    try{
      const {data,error}=await db.from('moo_documents')
        .update({payload:snap, revision:revision+1, updated_at:new Date().toISOString(), updated_by:me.id})
        .eq('id',1).eq('revision',revision).select('revision').maybeSingle();
      if(error)throw error;
      if(!data){blocked=true;status('Speicherkonflikt! Bitte JSON-Backup exportieren und Seite neu laden.','error');return;}
      revision=Number(data.revision);
      dirty=(n!==changed);
      if(!dirty)status('Online gespeichert ✓');
    }catch(e){blocked=true;status('Cloud-Speicherfehler: '+(e.message||e)+'. Daten sichern, bevor du neu lädst.','error');}
    finally{busy=false;if(dirty&&!blocked)saveTimer=setTimeout(flush,200);}
  }
  setInterval(async()=>{
    if(dirty||busy||blocked||document.querySelector('dialog[open]'))return;
    const active=document.activeElement;
    if(active?.matches('textarea, input:not([type=search]), select'))return;
    try{
      const {data,error}=await db.from('moo_documents').select('payload,revision').eq('id',1).single();
      if(error||!data || Number(data.revision)===revision)return;
      revision=Number(data.revision);
      onRemote(data.payload);
      status('Neue Daten synchronisiert ✓');
    } catch(_e){ /* nächster Abgleich */ }
  },10000);
  window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue='';}});
  return {
    user:me,role:roleResult.data.role,name:roleResult.data.display_name,
    payload:docResult.data.payload,
    get pending(){return dirty||busy;},
    setOnRemote(fn){onRemote=fn;},
    save(payload){
      if(!['admin','editor'].includes(roleResult.data.role))throw new Error('Nur Admins und Bearbeiter dürfen Änderungen speichern.');
      if(blocked)throw new Error('Cloud-Speicherung ist angehalten. Zuerst ein JSON-Backup exportieren.');
      lastPayload=structuredClone(payload);dirty=true;changed++;
      status('Änderung wird gespeichert …');
      clearTimeout(saveTimer);saveTimer=setTimeout(flush,480);
    },
    async logout(){if(dirty||busy)throw new Error('Noch nicht gespeicherte Änderungen. Bitte kurz später erneut versuchen.');await db.auth.signOut();location.reload();}
  };
}

const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function deleteOrderById(orderId){
 const target=state.orders.find(order=>order.id===orderId);
 if(!target){toast('Diese Bestellung wurde nicht gefunden.',true);return;}
 const hasFinished=target.lines.some(line=>line.done);
 const notice=hasFinished?'\n\nBereits abgebuchte Materialien bleiben im Lager als Bestandskorrektur berücksichtigt.':'';
 if(!confirm('Bestellung „'+target.title+'“ wirklich dauerhaft löschen?'+notice))return;
 mutate(()=>{
   // Verbrauchte Rohstoffe nach dem Entfernen der Bestellung weiterhin abbuchen.
   const booked={};
   for(const line of target.lines){
     if(!line.done)continue;
     for(const [item,qty] of Object.entries(line.booking||{})){
       if(qty>0)booked[item]=(booked[item]||0)+qty;
     }
   }
   for(const [item,qty] of Object.entries(booked)){
     state.adjustments.push({id:uid(),date:today(),item,qty:-qty,note:'Lagerabzug: gelöschte Bestellung „'+target.title+'“'});
   }
   state.orders=state.orders.filter(order=>order.id!==orderId);
   if(selectedOrder===orderId)selectedOrder=null;
 },'Bestellung gelöscht');
}

function inventoryView(){const current=stock(state),need=plan(state,openLines());const list=items().filter(k=>matches(k,state.inventory[k].note)&&(inventoryFilter==='all'||inventoryFilter==='raw'&&!state.recipes[k]||inventoryFilter==='product'&&state.recipes[k]||inventoryFilter==='short'&&(need.buy[k]||need.make[k]||current[k]<0)));return heading('Lagerbestand','Einkäufe und fertige Bestellungen werden automatisch verrechnet.',button(icon('plus')+' Einkauf erfassen','new-purchase'))+`<div class="stats compact">${summary('Artikel im Lager',items().filter(k=>current[k]>0).length,'Mit positivem Bestand','inventory')}${summary('Fehlende Rohstoffe',Object.keys(need.buy).length,'Für offene Bestellungen','orders')}${summary('Zu fertigende Produkte',Object.keys(need.make).length,'Lagerbestand bereits berücksichtigt','manufacture')}</div><div class="panel"><div class="toolbar"><div class="tabs">${[['all','Alle Artikel'],['raw','Rohstoffe'],['product','Produkte'],['short','Fehlmengen']].map(([v,t])=>`<button class="${inventoryFilter===v?'active':''}" data-action="inventory-filter" data-id="${v}">${t}</button>`).join('')}</div><small class="muted">${list.length} Artikel</small></div>${list.length?table(['Artikel','Art','Lagerbestand','Offener Bedarf','Noch benötigt','Notiz',''],list.map(k=>`<tr><td><b>${esc(k)}</b></td><td><span class="tag">${state.recipes[k]?'Produkt / Bauteil':'Rohstoff'}</span></td><td class="num ${current[k]<0?'negative':''}"><b>${number(current[k])}</b></td><td class="num">${number(need.demand[k])}</td><td class="num">${(need.buy[k]||need.make[k])?`<span class="badge open">${number(need.buy[k]||need.make[k])} ${state.recipes[k]?'herstellen':'beschaffen'}</span>`:'<span class="muted">—</span>'}</td><td>${esc(state.inventory[k].note)}</td><td>${button('Bestand korrigieren','adjust-stock','text',`data-item="${esc(k)}"`)}</td></tr>`)):empty('Keine Artikel gefunden','Passe Suche oder Filter an.')}</div><p class="footnote">Bestandskorrekturen erfassen einen ein function purchasesView(){const list=state.purchases.filter(p=>matches(p.item,p.supplier,p.note)).slice().reverse();return heading('Einkäufe','Neue Ware erfassen. Dein Lager wächst automatisch mit.',button(icon('plus')+' Einkauf erfassen','new-purchase'))+`<div class="panel">${list.length?table(['Datum','Material / Artikel','Menge','Stückpreis','Gesamtpreis','Lieferant','Notizen',''],list.map(p=>`<tr><td>${date(p.date)}</td><td><b>${esc(p.item)}</b><small class="positive">Im Lager gebucht</small></td><td class="num">+${number(p.qty)}</td><td class="num">${money(p.price)}</td><td class="num">${p.qty===0?money(0):money(p.price===null?null:p.price*p.qty)}</td><td>${esc(p.supplier)}</td><td>${esc(p.note)}</td><td>${button('Bearbeiten','edit-purchase','text',`data-id="${p.id}"`)}</td></tr>`)):empty('Der nächste Einkauf wartet','Wähle z. B. Eisen, Kohle oder Kupfer und trage die gekaufte Menge ein.',button('Ersten Einkauf erfassen','new-purchase'))}</div><div class="callout">${icon('inventory')}<p><b>Einmal eintragen genügt.</b> Einkäufe bleiben im Verlauf stehen. Bearbeiten oder Löschen korrigiert den Lagerbestand entsprechend.</p></div>`;}
function requirementTable(map,type='raw'){const current=stock(state);const keys=Object.keys(map).filter(k=>map[k]>1e-9);return keys.length?table(['Material / Produkt','Menge','Aktuell im Lager'],keys.map(k=>`<tr><td><b>${esc(k)}</b></td><td class="num"><span class="${type==='buy'?'negative':'gold'}">${number(map[k])}</span></td><td class="num">${number(current[k])}</td></tr>`)):empty('Kein Bedarf','Für diese Auswahl wird nichts benötigt.');}
function manufactureView(){const lines=calcLines.length?calcLines:openLines();let p=plan(state,lines);return heading('Herstellungsrechner','Von der Bestellung bis zum Erz – alle Rezeptstufen werden berücksichtigt.',button('Offene Bestellungen verwenden','reset-calculator','secondary'))+`<section class="panel calculator"><div class="section-head"><div><h3>${calcLines.length?'Eigene Planung':'Alle offenen Bestellungen'}</h3><p>${calcLines.length?'Die eigene Planung ersetzt hier die Auftragsauswahl.':'Lager und Zwischenprodukte sind bereits eingerechnet.'}</p></div>${button(icon('plus')+' Produkt planen','new-calc','secondary')}</div>${calcLines.length?calcLines.map((l,i)=>`<div class="calc-line"><b>${esc(l.product)}</b><span>${number(l.qty)} Stück</span>${button('Entfernen','remove-calc','text',`data-id="${i}"`)}</div>`).join(''):`<p class="muted">${openLines().length} offene Produktpositionen aus ${state.orders.filter(o=>o.lines.some(l=>!l.done&&l.qty>0&&l.status!=='cancel')).length} Bestellungen</p>`}</section>${p.errors.map(e=>`<p class="error-box">${esc(e)}. Bitte unter Rezepte ergänzen.</p>`).join('')}<div class="two-col"><section class="panel">${heading('Noch herstellen','Benötigte End- und Zwischenprodukte.')}${requirementTable(p.make)}</section><section class="panel">${heading('Noch beschaffen','Rohstoffe nach Abzug des vorhandenen Lagers.')}${requirementTable(p.buy,'buy')}</section></div><p class="footnote">Es wird anteilig pro gewünschtem Stück gerechnet, wie in deiner Tabelle. Keine automatische Aufrundung auf Herstellungsdurchgänge. Fehlende Rezeptmengen werden ausdrücklich gemeldet.</p>`;}
const smeltProducts=['Rennhufeisen','Goldbarren','Messingbarren','Kupferbarren','Silberbarren','Gehärteter Eisenbarren','Eisenbarren','Bleibarren'];
function smeltView(){let totals={},raw={},errors=[],active=false;for(const k of smeltProducts){const n=smeltQty[k]||0;if(n>0){active=true;try{for(const [item,qty]of Object.entries(explode(state,k,n,'parts')))totals[item]=(totals[item]||0)+qty;for(const [item,qty]of Object.entries(explode(state,k,n,'raw')))raw[item]=(raw[item]||0)+qty;}catch(e){errors.push(e.message);}}}return heading('Schmelze','Barren, Rennhufeisen und dein permanenter Eisenhammer.')+`<div class="two-col"><section class="panel">${heading('Was soll in die Schmelze?','Gewünschte Stückzahl eingeben.')}${table(['Produkt','Gewünschte Anzahl','Ausgabe je Rezept'],smeltProducts.map(k=>`<tr><td><b>${esc(k)}</b></td><td><input class="smelt-qty" data-item="${esc(k)}" type="text" inputmode="decimal" autocomplete="off" pattern="[0-9]+([.,][0-9]+)?" value="${smeltQty[k]>0?smeltQty[k]:''}" aria-label="Anzahl ${esc(k)}"></td><td class="num">${number(state.recipes[k]?.yield)}</td></tr>`))}<div class="hammer" id="smelt-hammer">${icon('manufacture')}<div><b>${active?'1 Eisenhammer benötigt':'Eisenhammer'}</b><small>Permanent · wird nicht verbraucht oder multipliziert</small></div></div></section><section id="smelt-results"><section class="panel">${heading('Direkte Zutaten','Gesamtbedarf für alle eingetragenen Produkte.')}${requirementTable(totals)}</section>${errors.map(e=>`<p class="error-box">${esc(e)}</p>`).join('')}<details class="panel"><summary>Bis zu den Rohstoffen aufschlüsseln</summary><p class="muted">Bruttobedarf ohne Lagerabzug.</p>${requirementTable(raw)}</details></section></div><p class="footnote">Anteilig gerechnet: z. B. 1 Goldbarren = 1 Kohle + 10 Goldnuggets. Der Rechner bucht keine Lagerbewegungen.</p>`;}
function recipesView(){const list=products().filter(k=>matches(k,...state.recipes[k].ingredients.map(i=>i.item)));return heading('Rezeptübersicht','Alle Rezepte, Ausgabemengen und Zutaten aus deiner Tabelle.')+`<section class="panel"><div class="toolbar"><span class="muted">${list.length} von ${products().length} Rezepten</span><small>Mit „Bearbeiten“ Mengen und Materialien jederzeit anpassen.</small></div>${table(['Produkt','Ausgabe je Herstellung','Zutaten je Rezept','Status','Aktionen'],list.map(k=>{const r=state.recipes[k],missing=!r.ingredients.length||r.ingredients.some(i=>typeof i.qty!=='number');return `<tr><td><b>${esc(k)}</b></td><td class="num">${number(r.yield)} Stück</td><td><div class="ingredient-tags">${r.ingredients.map(i=>`<span class="tag ${i.qty===null?'negative':''}">${i.qty===null?'?':number(i.qty)} × ${esc(i.item)}</span>`).join('')}</div></td><td><span class="badge ${missing?'open':'done'}">${missing?'Menge fehlt':'Vollständig'}</span></td><td>${button('Bearbeiten','edit-recipe','text',`data-item="${esc(k)}"`)}</td></tr>`}))}</section>`;}
function pricesView(){const list=(priceTab==='product'?products():items().filter(k=>!state.recipes[k])).filter(k=>matches(k));return heading('Preise & Kalkulation','Eigene Endpreise und Rohstoffpreise – Änderungen gelten sofort für offene Bestellungen.')+`<div class="panel price-search-panel"><div class="toolbar"><div class="tabs"><button data-action="price-tab" data-id="product" class="${priceTab==='product'?'active':''}">Produktpreise</button><button data-action="price-tab" data-id="raw" class="${priceTab==='raw'?'active':''}">Rohstoffpreise</button></div><small class="muted">0 $ ist ein gültiger Preis. Leer bedeutet: Preis fehlt.</small></div><div class="price-search-row"><label for="price-product-search">Produkt suchen</label><input id="price-product-search" type="search" placeholder="${priceTab==='product'?'Produkt eingeben, z. B. Nägel …':'Rohstoff eingeben, z. B. Eisen …'}" autocomplete="off" value="${esc(priceSearch)}" aria-label="Produkt oder Rohstoff in der Preisliste suchen"><span id="price-search-count" class="price-search-count" aria-live="polite"></span></div><p id="price-search-empty" class="price-search-empty" hidden>Keine passenden Artikel gefunden.</p>${table(priceTab==='product'?['Produkt','Verkaufspreis / Stück','Materialkosten / Stück','Differenz','']:['Rohstoff','Einkaufspreis / Stück',''],list.map(k=>{const p=priceTab==='product'?state.prices[k]:state.rawPrices[k],c=materialCost(state,k);return `<tr><td><b>${esc(k)}</b></td><td class="num gold">${money(p)}</td>${priceTab==='product'?`<td class="num">${money(c)}</td><td class="num ${c!==null&&typeof p==='number'&&p-c<0?'negative':'positive'}">${c!==null&&typeof p==='number'?money(p-c):'—'}</td>`:''}<td>${button('Preis ändern','edit-price','text',`data-item="${esc(k)}"`)}</td></tr>`}))}</div><p class="footnote">Materialkosten werden über alle Rezeptstufen berechnet. Arbeitszeit und zusätzliche Aufschläge sind nicht enthalten.</p>`;}
function contactsView(){const list=state.contacts.filter(c=>matches(c.name,c.telegram,c.note));return heading('Adressbuch','Kunden, Telegrammnummern und deine persönlichen Notizen.',button(icon('plus')+' Neuer Kontakt','new-contact'))+`<div class="panel">${table(['Name / Gewerbe','Telegramm','Notizen',''],list.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td><span class="tag">${esc(c.telegram||'—')}</span></td><td>${esc(c.note)}</td><td>${button('Bearbeiten','edit-contact','text',`data-id="${c.id}"`)}</td></tr>`))}</div>`;}
function settingsView(){return heading('Sicherung & Daten','Deine Werkstattdaten liegen in deiner gemeinsamen Supabase-Datenbank.')+`<div class="two-col"><section class="panel settings-card"><span class="mini-icon">${icon('download')}</span><h3>Sicherung herunterladen</h3><p>Speichert Bestellungen, Lager, Einkäufe, Rezepte, Preise und Kontakte in einer JSON-Datei. Regelmäßig sichern – besonders vor einem Gerätewechsel.</p>${button(icon('download')+' Sicherung exportieren','export')}</section><section class="panel settings-card"><span class="mini-icon">${icon('inventory')}</span><h3>Sicherung wiederherstellen</h3><p>Öffnet eine zuvor exportierte Sicherung. Die gemeinsamen Cloud-Daten werden nach einer Bestätigung ersetzt.</p><label class="button secondary" for="import-file">Sicherungsdatei auswählen</label><input id="import-file" type="file" accept="application/json,.json" hidden></section></div><section class="panel settings-card"><h3>Speicher & Zusammenarbeit</h3><p>Gemeinsame Speicherung über Supabase für alle berechtigten Benutzer. Änderungen werden automatisch gespeichert und zwischen Geräten synchronisiert. Bei einem Konflikt zuerst eine Sicherung exportieren.</p><p>Die Google-Tabelle wird nicht synchronisiert. Ausgangspunkt dieser Webseite ist der übernommene Tabellenstand vom ${date(state.snapshot)}. Bereits vorhandene Lagerbestände wurden als Ausgangsbestand übernommen.</p><p>Die GitHub-Webseite zeigt Verwaltungsdaten erst nach dem Login. Private Originaldaten befinden sich nicht im öffentlichen Website-Paket.</p><div class="info-grid"><span>Letzte Speicherung <b>${lastSaved?new Date(lastSaved).toLocaleString('de-DE'):'Noch keine Änderungen'}</b></span><span>Bestellungen <b>${state.orders.length}</b></span><span>Rezepte <b>${products().length}</b></span><span>Einkäufe <b>${state.purchases.length}</b></span></div>${button('Tabellen als CSV exportieren','export-csv','secondary')}</section><section class="panel settings-card"><h3>Bestandskorrekturen</h3><p>Diese Einträge gleichen gezählte Bestände ab und ändern keine Einkaufskosten.</p>${state.adjustments.length?table(['Datum','Artikel','Änderung','Grund'],state.adjustments.slice().reverse().map(a=>`<tr><td>${date(a.date)}</td><td>${esc(a.item)}</td><td class="num">${a.qty>0?'+':''}${number(a.qty)}</td><td>${esc(a.note)}</td></tr>`)):'<p class="muted">Noch keine Bestandskorrekturen.</p>'}</section>`;}

function field(label,name,value='',type='text',extra=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function select(label,name,options,value,blank=true){return `<label class="field">${label}<select name="${name}">${opts(options,value,blank)}</select></label>`;}
function textarea(label,name,value=''){return `<label class="field span2">${label}<textarea name="${name}" rows="3">${esc(value)}</textarea></label>`;}
function modal(title,content,save,other=''){const dialog=$('#dialog');dialog.classList.remove('order-dialog');dialog.innerHTML=`<form id="modal-form"><div class="dialog-head"><div class="eyebrow">MOO SCHMIEDE</div><button type="button" class="close" aria-label="Schließen">×</button><h2>${title}</h2></div><div class="form-grid">${content}</div><p id="form-error" class="negative" role="alert"></p><div class="dialog-actions">${other}<div class="push"></div><button type="button" class="secondary close">Abbrechen</button><button type="submit" class="primary">Speichern</button></div></form>`;dialog.querySelectorAll('.close').forEach(b=>b.onclick=()=>dialog.close());$('#modal-form').onsubmit=e=>{e.preventDefault();const old=clone(state);try{save(new FormData(e.target));persist('Gespeichert');dialog.close();render();}catch(error){state=old;$('#form-error').textContent=error.message;}};dialog.showModal();}
const nval=(f,key,blank=false)=>{const s=f.get(key);if(blank&&(s===null||s===''))return null;const n=Number(s);if(s===null||s===''||!Number.isFinite(n)||n<0)throw new Error('Bitte eine gültige Zahl ab 0 eingeben.');return n;};

function editRecipeModal(product){
  const recipe=state.recipes[product];
  if(!recipe)throw new Error('Dieses Rezept existiert nicht.');
  const candidates=items().filter(name=>name!==product);
  modal('Rezept: '+esc(product),
    field('Stück je Herstellung','yield',recipe.yield,'number','min="0.001" step="any" required')+
    '<p class="form-hint span2">Zutaten und Mengen für einen Herstellungsvorgang. Du kannst Materialien hinzufügen, ändern oder entfernen. Ein leeres Mengenfeld bedeutet: Menge fehlt.</p>'+
    '<div class="recipe-edit-box span2"><div class="recipe-edit-toolbar"><strong>Benötigte Materialien</strong><button type="button" class="secondary" id="recipe-add-ingredient">+ Zutat hinzufügen</button></div><div id="recipe-edit-list" class="recipe-edit-list"></div><small>Keine Zutaten oder eine fehlende Menge = Rezept unvollständig.</small></div>',
    form=>{
      const yieldCount=nval(form,'yield');
      if(yieldCount<=0)throw new Error('Die Ausgabemenge muss größer als 0 sein.');
      const ingredientRows=[...document.querySelectorAll('#recipe-edit-list .recipe-edit-row')];
      const ingredients=ingredientRows.map(row=>{
        const material=row.querySelector('.recipe-edit-material').value;
        const raw=row.querySelector('.recipe-edit-amount').value.trim();
        if(!material||!Object.hasOwn(state.inventory,material))throw new Error('Bitte für jede Zutat ein gültiges Material auswählen.');
        if(raw!==''&&!/^\d+(?:[.,]\d+)?$/.test(raw))throw new Error('Ungültige Menge bei '+material+'.');
        const qty=raw===''?null:Number(raw.replace(',','.'));
        if(qty!==null&&(!Number.isFinite(qty)||qty<0))throw new Error('Ungültige Menge bei '+material+'.');
        return {item:material,qty};
      });
      if(new Set(ingredients.map(ing=>ing.item)).size!==ingredients.length)throw new Error('Ein Material darf nicht mehrfach im selben Rezept vorkommen.');
      // Verhindert direkte und verschachtelte Rezeptkreisläufe, ohne andere Rezepte anzutasten.
      const seen=new Set();
      function reachesProduct(name){
        if(name===product)return true;
        if(seen.has(name))return false;
        seen.add(name);
        for(const ing of state.recipes[name]?.ingredients||[])if(reachesProduct(ing.item))return true;
        return false;
      }
      for(const ing of ingredients){seen.clear();if(reachesProduct(ing.item))throw new Error('Dieses Material würde einen Rezeptkreislauf erzeugen: '+ing.item);}
      recipe.yield=yieldCount;
      recipe.ingredients=ingredients;
    }
  );
  const list=document.querySelector('#recipe-edit-list');
  const add=document.querySelector('#recipe-add-ingredient');
  function addRow(ingredient={item:'',qty:null},focus=false){
    if(list.children.length>=30){toast('Maximal 30 Zutaten pro Rezept.',true);return;}
    const row=document.createElement('div');
    row.className='recipe-edit-row';
    row.innerHTML=
      '<label>Material<select class="recipe-edit-material" required><option value="">Zutat auswählen …</option>'+
      candidates.map(name=>'<option value="'+esc(name)+'" '+(name===ingredient.item?'selected':'')+'>'+esc(name)+'</option>').join('')+
      '</select></label>'+
      '<label>Menge<input class="recipe-edit-amount" type="text" inputmode="decimal" autocomplete="off" placeholder="Menge fehlt" value="'+(ingredient.qty===null||ingredient.qty===undefined?'':esc(ingredient.qty))+'"></label>'+
      '<button class="secondary recipe-remove-ingredient" type="button" aria-label="Zutat entfernen">Entfernen</button>';
    list.appendChild(row);
    if(focus)row.querySelector('select').focus();
  }
  recipe.ingredients.forEach(ingredient=>addRow(ingredient));
  add.addEventListener('click',()=>addRow({item:'',qty:null},true));
  list.addEventListener('click',event=>{
    const button=event.target.closest('.recipe-remove-ingredient');
    if(button)button.closest('.recipe-edit-row').remove();
  });
}

function orderModal(order){
 // Eine Bestellung kann mehrere, unabhängig berechenbare Schmiedeprodukte enthalten.
 const selectedProducts=[];
 const catalog=products();
 const picker=`<section class="order-product-picker span2" aria-label="Produkte für diese Bestellung">
  <div class="picker-title"><div><strong>Produkte auswählen</strong><small>Alle ${catalog.length} Schmiedeprodukte – mehrere Artikel und Mengen möglich</small></div><span class="picker-count" id="picked-count">0 ausgewählt</span></div>
  ${order&&order.lines.length?`<p class="picker-existing">Diese Bestellung hat bereits <b>${order.lines.length}</b> Positionen. Hier kannst du weitere Produkte hinzufügen; vorhandene Produkte bleiben unverändert.</p>`:''}
  <label class="picker-search-label" for="order-product-search">Produkt suchen</label>
  <input type="search" id="order-product-search" placeholder="Zum Beispiel Hufeisen, Axt, Nägel …" autocomplete="off">
  <div class="order-product-catalog" id="order-product-catalog" aria-label="Produktkatalog"></div>
  <div class="picker-selected-head"><strong>Ausgewählte Produkte</strong><small>Für jede Position die gewünschte Menge eintragen</small></div>
  <div class="order-product-selected" id="order-product-selected" aria-live="polite"></div>
  <div class="picker-total"><span>Geschätzter Bestellwert</span><b id="order-picked-total">0,00 $</b></div>
 </section>`;
 const form=field('Name der Bestellung','title',order?.title||'','text','required placeholder="z. B. Büchsenmacher Blackwater"')+
 `<div class="field order-contact-field"><label for="order-customer-input">Kunde / Gewerbe</label><input id="order-customer-input" name="customer" type="text" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="order-contact-suggestions" aria-expanded="false" placeholder="Name aus dem Adressbuch eingeben" value="${esc(order?.customer||'')}" required><div class="order-contact-suggestions" id="order-contact-suggestions" role="listbox" aria-label="Passende Adressbuch-Kontakte" hidden></div></div>`+
 field('Telegrammnummer','telegram',order?.telegram||'')+
 '<div class="picker-intro">Wähle unten deine Schmiedeprodukte aus.</div>'+picker+
 textarea('Notizen zur Bestellung','notes',order?.notes||'');
 modal(order?'Bestellung bearbeiten':'Neue Bestellung',form,f=>{
   if(!order&&!selectedProducts.length)throw new Error('Bitte füge mindestens ein Produkt zur Bestellung hinzu.');
   for(const line of selectedProducts){if(!Number.isInteger(line.qty)||line.qty<=0)throw new Error('Bitte für jedes Produkt eine ganze Menge ab 1 eingeben.');if(!state.recipes[line.product])throw new Error('Ein ausgewähltes Produkt existiert nicht mehr.');}
   const values={title:String(f.get('title')||'').trim(),customer:String(f.get('customer')||'').trim(),telegram:String(f.get('telegram')||'').trim(),notes:String(f.get('notes')||'').trim()};
   if(!values.title||!values.customer)throw new Error('Bitte Bestellungsname und Kunde eingeben.');
   const additions=selectedProducts.map(l=>({id:uid(),product:l.product,qty:l.qty,status:'open',mode:'raw',note:'',done:false,booking:{}}));
   if(order){const current=state.orders.find(o=>o.id===order.id);Object.assign(current,values);current.lines.push(...additions);}
   else{const created={id:uid(),...values,number:'',lines:additions};state.orders.push(created);selectedOrder=created.id;view='orders';location.hash='orders';}
   // Bestellkunden mit Telegrammnummer beim Speichern im Adressbuch ergänzen.

 const customerInput=dialog.querySelector('#order-customer-input');

 const normalizeContact=v=>String(v||'').trim().toLocaleLowerCase('de-DE');
 let matchesContacts=[],activeContact=-1;
 function hideContactList(){
   contactList.hidden=true;contactList.innerHTML='';
   customerInput.setAttribute('aria-expanded','false');
   customerInput.removeAttribute('aria-activedescendant');
   matchesContacts=[];activeContact=-1;
 }
 function showContactList(){
   const typed=normalizeContact(customerInput.value);
   matchesContacts=typed?state.contacts.filter(c=>normalizeContact(c.name).startsWith(typed)).slice(0,30):[];
   activeContact=-1;
   if(!matchesContacts.length){hideContactList();return;}
   contactList.innerHTML=matchesContacts.map((c,index)=>
     `<button type="button" class="order-contact-option" id="order-contact-opt-${index}" data-suggestion-index="${index}" role="option" aria-selected="false"><strong>${esc(c.name)}</strong><small>${esc(c.telegram||'Ohne Telegrammnummer')}${c.note?' · '+esc(c.note):''}</small></button>`
   ).join('');

 }
 function selectContact(c){
   if(!c)return;
   customerInput.value=c.name;
   telegramInput.value=c.telegram||'';
   hideContactList();
   customerInput.focus();
 }
 customerInput.addEventListener('focus',showContactList);
 customerInput.addEventListener('input',()=>{telegramInput.value='';showContactList();});
 customerInput.addEventListener('keydown',event=>{
   if((event.key==='ArrowDown'||event.key==='ArrowUp')&&matchesContacts.length){
     event.preventDefault();
     activeContact=(activeContact+(event.key==='ArrowDown'?1:-1)+matchesContacts.length)%matchesContacts.length;
     contactList.querySelectorAll('[data-suggestion-index]').forEach((b,i)=>{
       const active=i===activeContact;
       b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));
       if(active){customerInput.setAttribute('aria-activedescendant',b.id);b.scrollIntoView({block:'nearest'});}
     });
   }else if(event.key==='Enter'&&!contactList.hidden&&matchesContacts.length){
     event.preventDefault();selectContact(matchesContacts[activeContact<0?0:activeContact]);
   }else if(event.key==='Escape'&&!contactList.hidden){
     event.preventDefault();hideContactList();
   }
 });
 contactList.addEventListener('pointerdown',event=>{
   if(event.target.closest('[data-suggestion-index]'))event.preventDefault();

 document.querySelectorAll('.smelt-qty').forEach(input=>input.oninput=()=>{
  const raw=input.value.trim(),item=input.dataset.item;
  // Text-Eingabe statt Firefox-Zahlenfeld: Ziffern bleiben in der getippten Reihenfolge.
  // Auch während einer Dezimaleingabe (z. B. 1,5) bleibt der Wert bearbeitbar.
  const valid=raw==='' || /^\d+(?:[.,]\d*)?$/.test(raw);
  input.setCustomValidity(valid?'':'Bitte eine gültige Anzahl ab 0 eingeben.');
  if(!valid)return;
  const n=raw===''?0:Number(raw.replace(',', '.').replace(/\.$/,''));
  if(!Number.isFinite(n)||n<0)return;
  smeltQty[item]=n;
  const caret=input.selectionStart, selectionEnd=input.selectionEnd;
  // Nur Berechnung aktualisieren, nicht die Eingabefelder neu aufbauen.
  // So bleibt die Schreibposition erhalten (z. B. 5 -> 50 statt 05).
  const preview=document.createElement('div');
  preview.innerHTML=smeltView();
  const hammer=document.getElementById('smelt-hammer');
  const nextHammer=preview.querySelector('#smelt-hammer');
  if(hammer&&nextHammer)hammer.innerHTML=nextHammer.innerHTML;
  const results=document.getElementById('smelt-results');
  const nextResults=preview.querySelector('#smelt-results');
  if(results&&nextResults){
    const expanded=[...results.querySelectorAll('details')].map(d=>d.open);
    results.innerHTML=nextResults.innerHTML;
    results.querySelectorAll('details').forEach((d,i)=>d.open=Boolean(expanded[i]));
  }
  // Nur bei Bedarf wiederherstellen: Firefox darf den Cursor nicht an den Anfang setzen.
  if(document.activeElement===input && caret!==null && selectionEnd!==null &&
     (input.selectionStart!==caret || input.selectionEnd!==selectionEnd)){
    input.setSelectionRange(caret,selectionEnd);
  }
});
